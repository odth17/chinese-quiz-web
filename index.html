<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>중국어 기말 단어 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-box">
    <h1>중국어 기말 단어 퀴즈</h1>

    <div id="mode-box">
      <p class="question-title">퀴즈 모드를 선택하세요</p>

      <button onclick="startQuiz('meaning')">중국어 보고 뜻 맞추기</button>
<button onclick="startQuiz('pinyin')">중국어 보고 병음 맞추기</button>
<button onclick="startQuiz('chinese')">뜻 보고 중국어 맞추기</button>
<button onclick="startSentenceQuiz('sentenceMeaning')">중국어 문장 보고 해석 맞추기</button>
<button onclick="startSentenceQuiz('sentenceChinese')">해석 보고 중국어 문장 맞추기</button>
<button onclick="startOrderQuiz()">문장 순서 배열하기</button>
    </div>

    <div id="quiz-area" style="display: none;">
      <p id="progress">문제 1 / 10</p>

      <p class="question-title" id="mode-title">문제</p>
      <h2 id="question">推荐</h2>

      <div id="choices" class="choices"></div>

      <p id="result"></p>

      <button id="next-button" onclick="nextQuestion()">다음 문제</button>

<button id="home-button" onclick="goHome()">메인 메뉴로</button>

<p id="score">점수: 0</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
